name: Fetch jobs
on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC = 08:00 IST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-jobs
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch jobs (writes data/jobs.json and logs/fetch-*.log)
        run: npm run fetch-jobs:log
      - name: Sanity check
        run: node -e 'const d=require("./data/jobs.json"); if (d.jobs.length < 50) { console.error("Too few jobs:", d.jobs.length); process.exit(1) }'
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json logs/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily job fetch $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
