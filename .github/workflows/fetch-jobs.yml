name: Fetch jobs
on:
  schedule:
    # GitHub drops/delays top-of-hour schedules (Oct 17-20 runs landed 4-6h late or not at all).
    # Two off-peak minutes: 21:17 UTC (02:47 IST) primary, 01:43 UTC (07:13 IST) backup.
    - cron: "17 21 * * *"
    - cron: "43 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-jobs
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch jobs (writes data/jobs.json and logs/fetch-*.log)
        run: npm run fetch-jobs:log
      - name: Sanity check
        run: node -e 'const d=require("./data/jobs.json"); if (d.jobs.length < 50) { console.error("Too few jobs:", d.jobs.length); process.exit(1) }'
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json logs/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily job fetch $(date -u +%Y-%m-%dT%H:%MZ)"
          # Someone may push code while the fetch runs (Oct 24: run 40063494053 was rejected "fetch first").
          # Rebase onto the latest main and retry; only data/ and logs/ change here, so conflicts are unlikely.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $i failed, retrying"; sleep 5
          done
          exit 1
      - name: Keep Supabase awake (free projects pause after ~7 idle days)
        if: always()
        continue-on-error: true
        run: curl -fsS --max-time 30 https://ai-jobs-india.vercel.app/api/keepalive || echo "keepalive ping failed"
